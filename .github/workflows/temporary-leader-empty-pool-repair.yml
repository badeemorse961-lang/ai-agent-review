name: Temporary Leader Empty Pool Repair

on:
  push:
    branches:
      - milestone/professional-desktop-control-center

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LeaderRouter empty effective pools
        shell: pwsh
        run: |
          $path = "leader_router.py"
          $text = Get-Content -Raw -Encoding UTF8 $path
          $oldPrimary = 'if not isinstance(primary_pool, list) or not primary_pool:'
          $oldFailover = 'if not isinstance(failover_pool, list) or not failover_pool:'
          if ($text.Contains($oldPrimary) -and $text.Contains($oldFailover)) {
            $text = $text.Replace($oldPrimary, 'if not isinstance(primary_pool, list) or (not primary_pool and self.registry_file != REGISTRY_FILE):')
            $text = $text.Replace($oldFailover, 'if not isinstance(failover_pool, list) or (not failover_pool and self.registry_file != REGISTRY_FILE):')
            Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
          } elseif (-not $text.Contains('self.registry_file != REGISTRY_FILE')) {
            throw "Expected LeaderRouter guard text was not found; refusing to mutate source."
          }

      - name: Run focused regression
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q test_connection_manager.py test_connection_control_center.py test_connection_router_lifecycle.py test_connection_recovery.py test_provider_transport.py test_connection_ui.py
          python -m compileall -q .
          git diff --check

      - name: Commit repaired source and remove temporary workflow
        shell: pwsh
        env:
          BRANCH: milestone/professional-desktop-control-center
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-leader-empty-pool-repair.yml
          git add leader_router.py
          git commit -m "fix: allow LeaderRouter to fail closed when pools have no eligible connections"
          git push origin "HEAD:$env:BRANCH"
