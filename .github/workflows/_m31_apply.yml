name: M3.1 Contract Correction

on:
  push:
    branches:
      - milestone/persistent-project-run-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'badeemorse961-lang'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply M3.1 correction and targeted tests
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          state = root / 'durable_execution_state.py'
          evidence = root / 'durable_execution_evidence.py'
          orchestration = root / 'orchestration.py'

          text = state.read_text(encoding='utf-8')
          marker = 'SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n'
          replacement = '''SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n\nWORKSPACE_SCOPE_VERSION = "workspace-scope-v1"\nWORKSPACE_IDENTITY_ENCODING = "utf-8"\nWORKSPACE_IDENTITY_JSON_SEPARATORS = (",", ":")\n\n\ndef _workspace_identity_path(root: Path, relative_path: str) -> Path:\n    return (root / Path(*relative_path.split("/"))).resolve(strict=False)\n\n\ndef canonical_workspace_scope(targets: Iterable[str], workspace_root: Path) -> tuple[str, ...]:\n    \"\"\"Return the exact M3 target set in its durable canonical form.\"\"\"\n    root = Path(workspace_root).resolve()\n    canonical: set[str] = set()\n    for raw_target in targets:\n        raw = str(raw_target).replace("\\\\", "/")\n        if not raw or raw.startswith("/"):\n            raise ValueError(f"Workspace target must be workspace-relative: {raw_target!r}")\n        windows = PureWindowsPath(raw)\n        if windows.is_absolute() or windows.drive:\n            raise ValueError(f"Workspace target must not be absolute: {raw_target!r}")\n        candidate = (root / Path(*PurePosixPath(raw).parts)).resolve(strict=False)\n        try:\n            relative = candidate.relative_to(root).as_posix()\n        except ValueError as exc:\n            raise ValueError(f"Workspace target escapes workspace root: {raw_target!r}") from exc\n        canonical.add(relative)\n    return tuple(sorted(canonical))\n\n\ndef _canonical_workspace_identity_json(entries: list[tuple[str, str]]) -> str:\n    return json.dumps(entries, ensure_ascii=False, separators=WORKSPACE_IDENTITY_JSON_SEPARATORS)\n\n\ndef workspace_identity_from_scope(scope: tuple[str, ...], workspace_root: Path) -> str:\n    root = Path(workspace_root).resolve()\n    canonical_scope = canonical_workspace_scope(scope, root)\n    entries = [(relative, workspace_path_identity(_workspace_identity_path(root, relative))) for relative in canonical_scope]\n    material = _canonical_workspace_identity_json(entries)\n    return hashlib.sha256(material.encode(WORKSPACE_IDENTITY_ENCODING)).hexdigest()\n\n\ndef workspace_path_identity(path: Path) -> str:\n    if not path.exists():\n        return "ABSENT"\n    if path.is_file():\n        digest = hashlib.sha256()\n        with path.open("rb") as handle:\n            for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                digest.update(chunk)\n        return "sha256:" + digest.hexdigest()\n    return "DIRECTORY"\n\n'''
          if marker not in text:
              raise SystemExit('state marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom pathlib import PurePosixPath, PureWindowsPath\n', 1)
          old_fields = '''    checkpoint_id: Optional[str]\n    artifact_id: Optional[str]\n    evidence_created_at: str\n'''
          new_fields = '''    checkpoint_id: Optional[str]\n    artifact_id: Optional[str]\n    evidence_created_at: str\n    workspace_scope_version: Optional[str] = None\n    workspace_scope_entries: Optional[tuple[str, ...]] = None\n'''
          if old_fields not in text:
              raise SystemExit('WorkspaceEvidence fields marker not found')
          text = text.replace(old_fields, new_fields, 1)
          old_dict = '''            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n'''
          new_dict = '''            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n            "workspace_scope_version": self.workspace_scope_version,\n            "workspace_scope_entries": list(self.workspace_scope_entries) if self.workspace_scope_entries is not None else None,\n'''
          if old_dict not in text:
              raise SystemExit('WorkspaceEvidence dict marker not found')
          text = text.replace(old_dict, new_dict, 1)
          old_table = '''            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n'''
          new_table = '''            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            workspace_scope_version TEXT,\n            workspace_scope_entries TEXT,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n'''
          if old_table not in text:
              raise SystemExit('workspace evidence schema marker not found')
          text = text.replace(old_table, new_table, 1)
          old_schema_end = '''        with self._lock:\n            self._connection.executescript(schema)\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'''
          new_schema_end = '''        with self._lock:\n            self._connection.executescript(schema)\n            columns = {str(item["name"]) for item in self._connection.execute("PRAGMA table_info(workspace_evidence)").fetchall()}\n            if "workspace_scope_version" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_version TEXT")\n            if "workspace_scope_entries" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_entries TEXT")\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'''
          if old_schema_end not in text:
              raise SystemExit('schema initialization marker not found')
          text = text.replace(old_schema_end, new_schema_end, 1)
          old_insert = '''                "INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",\n                (\n                    evidence.project_id,\n                    evidence.run_id,\n                    evidence.phase_id,\n                    evidence.task_id,\n                    evidence.attempt_id,\n                    evidence.relative_path,\n                    evidence.change_kind,\n                    evidence.expected_before_identity,\n                    evidence.observed_before_identity,\n                    evidence.expected_after_identity,\n                    evidence.observed_after_identity,\n                    evidence.observed_state,\n                    checkpoint_id,\n                    artifact_id,\n                    evidence.evidence_created_at,\n                ),\n'''
          new_insert = '''                "INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",\n                (\n                    evidence.project_id,\n                    evidence.run_id,\n                    evidence.phase_id,\n                    evidence.task_id,\n                    evidence.attempt_id,\n                    evidence.relative_path,\n                    evidence.change_kind,\n                    evidence.expected_before_identity,\n                    evidence.observed_before_identity,\n                    evidence.expected_after_identity,\n                    evidence.observed_after_identity,\n                    evidence.observed_state,\n                    checkpoint_id,\n                    artifact_id,\n                    evidence.evidence_created_at,\n                    evidence.workspace_scope_version,\n                    json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None,\n                ),\n'''
          if old_insert not in text:
              raise SystemExit('state evidence insert marker not found')
          text = text.replace(old_insert, new_insert, 1)
          text = text.replace('    "WorkspaceEvidence",\n', '    "WorkspaceEvidence",\n    "WORKSPACE_SCOPE_VERSION",\n    "canonical_workspace_scope",\n    "workspace_identity_from_scope",\n    "workspace_path_identity",\n', 1)
          state.write_text(text, encoding='utf-8')

          text = evidence.read_text(encoding='utf-8')
          old_digest = '''        "checkpoint_id": evidence.checkpoint_id,\n        "artifact_id": evidence.artifact_id,\n        "evidence_created_at": evidence.evidence_created_at,\n'''
          new_digest = '''        "checkpoint_id": evidence.checkpoint_id,\n        "artifact_id": evidence.artifact_id,\n        "evidence_created_at": evidence.evidence_created_at,\n        "workspace_scope_version": evidence.workspace_scope_version,\n        "workspace_scope_entries": list(evidence.workspace_scope_entries) if evidence.workspace_scope_entries is not None else None,\n'''
          if old_digest not in text:
              raise SystemExit('evidence digest marker not found')
          text = text.replace(old_digest, new_digest, 1)
          old_layer_insert = '''            cursor = conn.execute("INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (evidence.project_id, evidence.run_id, evidence.phase_id, evidence.task_id, evidence.attempt_id, evidence.relative_path, evidence.change_kind, evidence.expected_before_identity, evidence.observed_before_identity, evidence.expected_after_identity, evidence.observed_after_identity, evidence.observed_state, evidence.checkpoint_id, evidence.artifact_id, evidence.evidence_created_at))\n'''
          new_layer_insert = '''            cursor = conn.execute("INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (evidence.project_id, evidence.run_id, evidence.phase_id, evidence.task_id, evidence.attempt_id, evidence.relative_path, evidence.change_kind, evidence.expected_before_identity, evidence.observed_before_identity, evidence.expected_after_identity, evidence.observed_after_identity, evidence.observed_state, evidence.checkpoint_id, evidence.artifact_id, evidence.evidence_created_at, evidence.workspace_scope_version, json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None))\n'''
          if old_layer_insert not in text:
              raise SystemExit('EvidenceLayer insert marker not found')
          text = text.replace(old_layer_insert, new_layer_insert, 1)
          evidence.write_text(text, encoding='utf-8')

          text = orchestration.read_text(encoding='utf-8')
          old_import = 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, utc_now\n'
          new_import = 'from durable_execution_state import (DurableExecutionState, LineageError, WorkspaceEvidence, canonical_workspace_scope, utc_now, workspace_identity_from_scope, workspace_path_identity, WORKSPACE_SCOPE_VERSION)\n'
          if old_import not in text:
              raise SystemExit('orchestration import marker not found')
          text = text.replace(old_import, new_import, 1)
          old_signature = 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str) -> tuple[str, str, str, int]:'
          new_signature = 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str, workspace_scope: tuple[str, ...]) -> tuple[str, str, str, int]:'
          if old_signature not in text:
              raise SystemExit('persist signature marker not found')
          text = text.replace(old_signature, new_signature, 1)
          old_evidence = 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now())'
          new_evidence = 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now(), workspace_scope_version=WORKSPACE_SCOPE_VERSION, workspace_scope_entries=workspace_scope)'
          if old_evidence not in text:
              raise SystemExit('M3 evidence construction marker not found')
          text = text.replace(old_evidence, new_evidence, 1)
          old_identity = '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        entries: list[tuple[str, str]] = []\n        for target in sorted(set(targets)):\n            candidate = (self.workspace_root / target).resolve(strict=False)\n            try:\n                candidate.relative_to(self.workspace_root)\n            except ValueError as exc:\n                raise OrchestrationSafetyStop(f"Workspace target escapes durable workspace: {target!r}") from exc\n            entries.append((target, self._path_identity(candidate)))\n        return hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n\n    @staticmethod\n    def _path_identity(path: Path) -> str:\n        if not path.exists():\n            return "ABSENT"\n        if path.is_file():\n            digest = hashlib.sha256()\n            with path.open("rb") as handle:\n                for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                    digest.update(chunk)\n            return "sha256:" + digest.hexdigest()\n        return "DIRECTORY"\n'''
          new_identity = '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        try:\n            scope = canonical_workspace_scope(targets, self.workspace_root)\n        except ValueError as exc:\n            raise OrchestrationSafetyStop(str(exc)) from exc\n        return workspace_identity_from_scope(scope, self.workspace_root)\n\n    @staticmethod\n    def _path_identity(path: Path) -> str:\n        return workspace_path_identity(path)\n'''
          if old_identity not in text:
              raise SystemExit('workspace identity implementation marker not found')
          text = text.replace(old_identity, new_identity, 1)
          old_observed = '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        if not targets:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in targets]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n'''
          new_observed = '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        canonical = canonical_workspace_scope(targets, root)\n        if not canonical:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in canonical]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n'''
          if old_observed not in text:
              raise SystemExit('observed state marker not found')
          text = text.replace(old_observed, new_observed, 1)
          old_row = 'return WorkspaceEvidence(project_id=str(row["project_id"]), run_id=str(row["run_id"]), phase_id=str(row["phase_id"]), task_id=str(row["task_id"]), attempt_id=str(row["attempt_id"]), relative_path=str(row["relative_path"]), change_kind=str(row["change_kind"]), expected_before_identity=row["expected_before_identity"], observed_before_identity=row["observed_before_identity"], expected_after_identity=row["expected_after_identity"], observed_after_identity=row["observed_after_identity"], observed_state=str(row["observed_state"]), checkpoint_id=row["checkpoint_id"], artifact_id=row["artifact_id"], evidence_created_at=str(row["evidence_created_at"]))'
          new_row = 'return WorkspaceEvidence(project_id=str(row["project_id"]), run_id=str(row["run_id"]), phase_id=str(row["phase_id"]), task_id=str(row["task_id"]), attempt_id=str(row["attempt_id"]), relative_path=str(row["relative_path"]), change_kind=str(row["change_kind"]), expected_before_identity=row["expected_before_identity"], observed_before_identity=row["observed_before_identity"], expected_after_identity=row["expected_after_identity"], observed_after_identity=row["observed_after_identity"], observed_state=str(row["observed_state"]), checkpoint_id=row["checkpoint_id"], artifact_id=row["artifact_id"], evidence_created_at=str(row["evidence_created_at"]), workspace_scope_version=row["workspace_scope_version"], workspace_scope_entries=tuple(json.loads(row["workspace_scope_entries"])) if row["workspace_scope_entries"] is not None else None)'
          if old_row not in text:
              raise SystemExit('evidence row reconstruction marker not found')
          text = text.replace(old_row, new_row, 1)
          old_call = 'self._durable.persist_post_execution(run_id, phase_id, task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, observed_state)'
          new_call = 'self._durable.persist_post_execution(run_id, phase_id, task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, observed_state, canonical_workspace_scope(spec.changed_targets, self.workspace_root))'
          if old_call not in text:
              raise SystemExit('persist call marker not found')
          text = text.replace(old_call, new_call, 1)
          orchestration.write_text(text, encoding='utf-8')

          tests = root / 'test_m31_workspace_identity.py'
          tests.write_text(r'''from pathlib import Path\n\nimport pytest\n\nfrom durable_execution_evidence import EvidenceLayer, evidence_digest\nfrom durable_execution_state import (\n    DurableExecutionState,\n    WorkspaceEvidence,\n    WORKSPACE_SCOPE_VERSION,\n    canonical_workspace_scope,\n    workspace_identity_from_scope,\n)\nfrom orchestration import _DurableLifecycleBridge\n\n\ndef _base(tmp_path: Path):\n    root = tmp_path / "workspace"\n    root.mkdir()\n    db = tmp_path / "state.db"\n    state = DurableExecutionState(db)\n    bridge = _DurableLifecycleBridge(state, root)\n    bridge.create_run()\n    run_id = bridge.create_run()\n    return root, db, state, bridge, run_id\n\n\ndef _lineage(state: DurableExecutionState, bridge: _DurableLifecycleBridge, run_id: str):\n    phase_id = "phase-1"\n    task_id = "task-1"\n    attempt_id = "attempt-1"\n    bridge.start_phase(run_id, phase_id)\n    bridge.start_task(run_id, phase_id, {"task_id": task_id, "objective": "test"})\n    bridge.start_attempt(run_id, phase_id, task_id, attempt_id, "worker-1")\n    return phase_id, task_id, attempt_id\n\n\ndef _persist_evidence(state, bridge, run_id, scope):\n    phase_id, task_id, attempt_id = _lineage(state, bridge, run_id)\n    identity = workspace_identity_from_scope(scope, bridge.workspace_root)\n    evidence = WorkspaceEvidence(\n        project_id=bridge.project_id,\n        run_id=run_id,\n        phase_id=phase_id,\n        task_id=task_id,\n        attempt_id=attempt_id,\n        relative_path=".",\n        change_kind="MODIFIED",\n        expected_before_identity=identity,\n        observed_before_identity=identity,\n        expected_after_identity=identity,\n        observed_after_identity=identity,\n        observed_state="PRESENT_COMPLETE",\n        checkpoint_id=None,\n        artifact_id=None,\n        evidence_created_at="2026-01-01T00:00:00+00:00",\n        workspace_scope_version=WORKSPACE_SCOPE_VERSION,\n        workspace_scope_entries=scope,\n    )\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(evidence)\n    return phase_id, task_id, attempt_id, identity, evidence_id\n\n\ndef test_new_evidence_persists_scope_version_and_entries(tmp_path):\n    root, _, state, bridge, run_id = _base(tmp_path)\n    (root / "b.txt").write_text("b", encoding="utf-8")\n    (root / "a.txt").write_text("a", encoding="utf-8")\n    scope = canonical_workspace_scope(("b.txt", "a.txt", "a.txt"), root)\n    _, _, _, _, evidence_id = _persist_evidence(state, bridge, run_id, scope)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert row["workspace_scope_entries"] == '["a.txt","b.txt"]'\n\n\ndef test_scope_ordering_duplicate_normalization_and_paths(tmp_path):\n    root = tmp_path / "workspace"\n    root.mkdir()\n    scope = canonical_workspace_scope(("b\\\\x.txt", "a.txt", "b/x.txt", "./a.txt"), root)\n    assert scope == ("a.txt", "b/x.txt")\n    with pytest.raises(ValueError):\n        canonical_workspace_scope((str((root / "abs.txt").resolve()),), root)\n    with pytest.raises(ValueError):\n        canonical_workspace_scope(("../outside.txt",), root)\n\n\ndef test_empty_scope_is_canonical_and_deterministic(tmp_path):\n    root = tmp_path / "workspace"\n    root.mkdir()\n    scope = canonical_workspace_scope((), root)\n    assert scope == ()\n    assert workspace_identity_from_scope(scope, root) == workspace_identity_from_scope((), root)\n\n\ndef test_file_directory_and_absent_semantics_are_preserved(tmp_path):\n    root = tmp_path / "workspace"\n    root.mkdir()\n    (root / "file.txt").write_text("v1", encoding="utf-8")\n    (root / "dir").mkdir()\n    scope = canonical_workspace_scope(("file.txt", "dir", "missing.txt"), root)\n    first = workspace_identity_from_scope(scope, root)\n    (root / "file.txt").write_text("v2", encoding="utf-8")\n    second = workspace_identity_from_scope(scope, root)\n    assert first != second\n    (root / "outside.txt").write_text("outside", encoding="utf-8")\n    third = workspace_identity_from_scope(scope, root)\n    assert second == third\n\n\ndef test_close_reopen_reconstructs_exact_m3_identity(tmp_path):\n    root, db, state, bridge, run_id = _base(tmp_path)\n    (root / "changed.txt").write_text("v1", encoding="utf-8")\n    scope = canonical_workspace_scope(("changed.txt",), root)\n    _, _, _, identity, evidence_id = _persist_evidence(state, bridge, run_id, scope)\n    persisted = state._connection.execute("SELECT expected_after_identity, workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert persisted["expected_after_identity"] == identity\n    state.close()\n    reopened = DurableExecutionState(db)\n    row = reopened._connection.execute("SELECT * FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    persisted_scope = tuple(__import__("json").loads(row["workspace_scope_entries"]))\n    reconstructed = workspace_identity_from_scope(persisted_scope, root)\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert reconstructed == row["expected_after_identity"]\n\n\ndef test_legacy_workspace_evidence_is_insufficient_without_scope_metadata(tmp_path):\n    root, _, state, bridge, run_id = _base(tmp_path)\n    phase_id, task_id, attempt_id = _lineage(state, bridge, run_id)\n    legacy = WorkspaceEvidence(\n        project_id=bridge.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id,\n        relative_path=".", change_kind="MODIFIED", expected_before_identity="x", observed_before_identity="x",\n        expected_after_identity="x", observed_after_identity="x", observed_state="PRESENT_COMPLETE",\n        checkpoint_id=None, artifact_id=None, evidence_created_at="2026-01-01T00:00:00+00:00",\n    )\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(legacy)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] is None\n    assert row["workspace_scope_entries"] is None\n\n\ndef test_unsupported_scope_version_is_rejected(tmp_path):\n    root, _, state, bridge, run_id = _base(tmp_path)\n    phase_id, task_id, attempt_id = _lineage(state, bridge, run_id)\n    bad = WorkspaceEvidence(\n        project_id=bridge.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id,\n        relative_path=".", change_kind="MODIFIED", expected_before_identity="x", observed_before_identity="x",\n        expected_after_identity="x", observed_after_identity="x", observed_state="PRESENT_COMPLETE",\n        checkpoint_id=None, artifact_id=None, evidence_created_at="2026-01-01T00:00:00+00:00",\n        workspace_scope_version="workspace-scope-v999", workspace_scope_entries=("a.txt",),\n    )\n    with pytest.raises(ValueError):\n        EvidenceLayer(state).record_workspace_evidence(bad)\n\n\ndef test_real_m3_lifecycle_persists_canonical_scope(tmp_path):\n    root = tmp_path / "workspace"\n    root.mkdir()\n    db = tmp_path / "state.db"\n    state = DurableExecutionState(db)\n    bridge = _DurableLifecycleBridge(state, root)\n    run_id = bridge.create_run()\n    phase_id = "phase-1"\n    task_id = "task-1"\n    attempt_id = "attempt-1"\n    bridge.start_phase(run_id, phase_id)\n    bridge.start_task(run_id, phase_id, {"task_id": task_id, "objective": "test"})\n    bridge.start_attempt(run_id, phase_id, task_id, attempt_id, "worker-1")\n    (root / "a.txt").write_text("before", encoding="utf-8")\n    spec_scope = canonical_workspace_scope(("b.txt", "a.txt", "a.txt"), root)\n    before = bridge._workspace_identity(spec_scope)\n    (root / "b.txt").write_text("after", encoding="utf-8")\n    after = bridge._workspace_identity(spec_scope)\n    assert before != after\n    bridge.persist_post_execution(run_id, phase_id, task_id, attempt_id, "raw", before, after, "PRESENT_COMPLETE", spec_scope)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries, expected_after_identity FROM workspace_evidence WHERE run_id=? ORDER BY evidence_id DESC LIMIT 1", (run_id,)).fetchone()\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert tuple(__import__("json").loads(row["workspace_scope_entries"])) == ("a.txt", "b.txt")\n    assert workspace_identity_from_scope(("a.txt", "b.txt"), root) == row["expected_after_identity"]\n''', encoding='utf-8')

