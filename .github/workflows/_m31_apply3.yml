name: M3.1 Contract Correction Apply 3

on:
  push:
    branches:
      - milestone/persistent-project-run-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'badeemorse961-lang'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M3.1 correction
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re, subprocess, sys

          root = Path('.')
          state = root / 'durable_execution_state.py'
          evidence = root / 'durable_execution_evidence.py'
          orchestration = root / 'orchestration.py'

          s = state.read_text(encoding='utf-8')
          if 'WORKSPACE_SCOPE_VERSION = "workspace-scope-v1"' not in s:
              s = s.replace(
                  'from pathlib import Path\n',
                  'from pathlib import Path\nfrom pathlib import PurePosixPath, PureWindowsPath\n', 1,
              )
              s = s.replace(
                  'SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n',
                  '''SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n\nWORKSPACE_SCOPE_VERSION = "workspace-scope-v1"\nWORKSPACE_IDENTITY_ENCODING = "utf-8"\nWORKSPACE_IDENTITY_JSON_SEPARATORS = (",", ":")\n\n\ndef canonical_workspace_scope(targets: Iterable[str], workspace_root: Path) -> tuple[str, ...]:\n    """Canonicalize the exact M3 target set for durable workspace evidence."""\n    root = Path(workspace_root).resolve()\n    canonical: set[str] = set()\n    for raw_target in targets:\n        raw = str(raw_target).replace("\\\\", "/")\n        if not raw or raw.startswith("/"):\n            raise ValueError(f"Workspace target must be workspace-relative: {raw_target!r}")\n        windows = PureWindowsPath(raw)\n        if windows.is_absolute() or windows.drive:\n            raise ValueError(f"Workspace target must not be absolute: {raw_target!r}")\n        candidate = (root / Path(*PurePosixPath(raw).parts)).resolve(strict=False)\n        try:\n            relative = candidate.relative_to(root).as_posix()\n        except ValueError as exc:\n            raise ValueError(f"Workspace target escapes workspace root: {raw_target!r}") from exc\n        canonical.add(relative)\n    return tuple(sorted(canonical))\n\n\ndef workspace_path_identity(path: Path) -> str:\n    if not path.exists():\n        return "ABSENT"\n    if path.is_file():\n        digest = hashlib.sha256()\n        with path.open("rb") as handle:\n            for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                digest.update(chunk)\n        return "sha256:" + digest.hexdigest()\n    return "DIRECTORY"\n\n\ndef workspace_identity_from_scope(scope: tuple[str, ...], workspace_root: Path) -> str:\n    root = Path(workspace_root).resolve()\n    canonical_scope = canonical_workspace_scope(scope, root)\n    entries = [(relative, workspace_path_identity((root / Path(*relative.split("/"))).resolve(strict=False))) for relative in canonical_scope]\n    material = json.dumps(entries, ensure_ascii=True, sort_keys=True, separators=WORKSPACE_IDENTITY_JSON_SEPARATORS)\n    return hashlib.sha256(material.encode(WORKSPACE_IDENTITY_ENCODING)).hexdigest()\n\n''', 1,
              )
              fields = '    checkpoint_id: Optional[str]\n    artifact_id: Optional[str]\n    evidence_created_at: str\n'
              s = s.replace(fields, fields + '    workspace_scope_version: Optional[str] = None\n    workspace_scope_entries: Optional[tuple[str, ...]] = None\n', 1)
              d = '            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n'
              s = s.replace(d, d + '            "workspace_scope_version": self.workspace_scope_version,\n            "workspace_scope_entries": list(self.workspace_scope_entries) if self.workspace_scope_entries is not None else None,\n', 1)
              tm = '            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n'
              s = s.replace(tm, '            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            workspace_scope_version TEXT,\n            workspace_scope_entries TEXT,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n', 1)
              im = '        with self._lock:\n            self._connection.executescript(schema)\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'
              ir = '        with self._lock:\n            self._connection.executescript(schema)\n            columns = {str(item["name"]) for item in self._connection.execute("PRAGMA table_info(workspace_evidence)").fetchall()}\n            if "workspace_scope_version" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_version TEXT")\n            if "workspace_scope_entries" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_entries TEXT")\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'
              s = s.replace(im, ir, 1)
              old_insert = 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
              new_insert = 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
              s = s.replace(old_insert, new_insert, 1)
              value = '                    evidence.evidence_created_at,\n                ),'
              if value not in s: raise SystemExit('state insert values marker not found')
              s = s.replace(value, '                    evidence.evidence_created_at,\n                    evidence.workspace_scope_version,\n                    json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None,\n                ),', 1)
              s = s.replace('    "WorkspaceEvidence",\n', '    "WorkspaceEvidence",\n    "WORKSPACE_SCOPE_VERSION",\n    "canonical_workspace_scope",\n    "workspace_identity_from_scope",\n    "workspace_path_identity",\n', 1)
              state.write_text(s, encoding='utf-8')
          s = state.read_text(encoding='utf-8')
          state.write_text(s, encoding='utf-8')

          e = evidence.read_text(encoding='utf-8')
          if 'workspace_scope_entries' not in e:
              e = e.replace('from durable_execution_state import (\n', 'from durable_execution_state import (\n    WORKSPACE_SCOPE_VERSION,\n', 1)
              dm = '        "artifact_id": evidence.artifact_id,\n        "evidence_created_at": evidence.evidence_created_at,\n'
              e = e.replace(dm, dm + '        "workspace_scope_version": evidence.workspace_scope_version,\n        "workspace_scope_entries": list(evidence.workspace_scope_entries) if evidence.workspace_scope_entries is not None else None,\n', 1)
              lm = 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
              lr = 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
              e = e.replace(lm, lr, 1)
              e = e.replace('evidence.artifact_id, evidence.evidence_created_at))', 'evidence.artifact_id, evidence.evidence_created_at, evidence.workspace_scope_version, json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None))', 1)
              vm = '        if evidence.observed_state not in {"PRESENT_COMPLETE", "PRESENT_PARTIAL", "ABSENT", "MISMATCH", "AMBIGUOUS"}:\n            raise ValueError("Unsupported workspace observed_state")\n'
              vr = vm + '        if (evidence.workspace_scope_version is None) != (evidence.workspace_scope_entries is None):\n            raise ValueError("Workspace scope metadata must be provided together")\n        if evidence.workspace_scope_version is not None and evidence.workspace_scope_version != WORKSPACE_SCOPE_VERSION:\n            raise ValueError("Unsupported workspace scope version")\n'
              e = e.replace(vm, vr, 1)
              evidence.write_text(e, encoding='utf-8')

          o = orchestration.read_text(encoding='utf-8')
          if 'workspace_scope_version=WORKSPACE_SCOPE_VERSION' not in o:
              o = o.replace('from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, utc_now\n', 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION, canonical_workspace_scope, utc_now, workspace_identity_from_scope, workspace_path_identity\n', 1)
              old_sig = 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str) -> tuple[str, str, str, int]:'
              new_sig = old_sig[:-1] + ', workspace_scope: tuple[str, ...]) -> tuple[str, str, str, int]:'
              o = o.replace(old_sig, new_sig, 1)
              old_ev = 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now())'
              new_ev = old_ev[:-1] + ', workspace_scope_version=WORKSPACE_SCOPE_VERSION, workspace_scope_entries=workspace_scope)'
              o = o.replace(old_ev, new_ev, 1)
              start = o.index('    def _workspace_identity(')
              path_start = o.index('    @staticmethod\n    def _path_identity', start)
              o = o[:start] + '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        try:\n            scope = canonical_workspace_scope(targets, self.workspace_root)\n        except ValueError as exc:\n            raise OrchestrationSafetyStop(str(exc)) from exc\n        return workspace_identity_from_scope(scope, self.workspace_root)\n\n''' + o[path_start:]
              observed_start = o.index('    @staticmethod\n    def _observed_state', o.index('def _path_identity'))
              evidence_start = o.index('    @staticmethod\n    def _evidence_from_row', observed_start)
              o = o[:observed_start] + '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        canonical = canonical_workspace_scope(targets, root)\n        if not canonical:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in canonical]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n\n''' + o[evidence_start:]
              row_start = o.index('        return WorkspaceEvidence(', o.index('def _evidence_from_row'))
              row_end = o.index('\n', o.index('))', row_start))
              row_text = o[row_start:row_end]
              if 'workspace_scope_version=' not in row_text:
                  row_text = row_text[:-1] + ', workspace_scope_version=row["workspace_scope_version"], workspace_scope_entries=tuple(json.loads(row["workspace_scope_entries"])) if row["workspace_scope_entries"] is not None else None)'
                  o = o[:row_start] + row_text + o[row_end:]
              call_old = 'self._durable._observed_state(spec.changed_targets, self.workspace_root))'
              call_new = 'self._durable._observed_state(spec.changed_targets, self.workspace_root), canonical_workspace_scope(spec.changed_targets, self.workspace_root))'
              o = o.replace(call_old, call_new, 1)
              orchestration.write_text(o, encoding='utf-8')

          t = root / 'test_m31_workspace_identity.py'
          t.write_text('''from pathlib import Path\nimport json\nimport pytest\nfrom durable_execution_evidence import EvidenceLayer\nfrom durable_execution_state import (DurableExecutionState, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION, canonical_workspace_scope, workspace_identity_from_scope)\nfrom test_orchestration_durable import build_durable_orchestrator\n\n\ndef test_scope_contract_is_canonical(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    assert canonical_workspace_scope(("b\\\\x.txt", "a.txt", "b/x.txt", "./a.txt"), root) == ("a.txt", "b/x.txt")\n    with pytest.raises(ValueError): canonical_workspace_scope((str(root / "absolute.txt"),), root)\n    with pytest.raises(ValueError): canonical_workspace_scope(("../outside.txt",), root)\n\n\ndef test_empty_scope_is_canonical(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    assert canonical_workspace_scope((), root) == ()\n    assert workspace_identity_from_scope((), root) == workspace_identity_from_scope((), root)\n\n\ndef test_scope_identity_tracks_only_scope(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    (root / "target.txt").write_text("v1", encoding="utf-8")\n    scope = canonical_workspace_scope(("target.txt",), root)\n    first = workspace_identity_from_scope(scope, root)\n    (root / "outside.txt").write_text("outside", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) == first\n    (root / "target.txt").write_text("v2", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) != first\n\n\ndef test_directory_and_absent_semantics(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir(); (root / "dir").mkdir()\n    scope = canonical_workspace_scope(("dir", "missing.txt"), root)\n    assert '"DIRECTORY"' in json.dumps([(p, "DIRECTORY" if p == "dir" else "ABSENT") for p in scope])\n    assert workspace_identity_from_scope(scope, root) == workspace_identity_from_scope(scope, root)\n\n\ndef test_real_m3_restart_reconstructs_exact_identity(tmp_path):\n    root = tmp_path / "project"; root.mkdir()\n    (root / "target.txt").write_text('VALUE = "before"', encoding="utf-8")\n    orchestrator, state, _, _ = build_durable_orchestrator(root, tmp_path / "execution.sqlite3", worker_adapter=None)\n    # Use the real M3 lifecycle with its canonical StubWorkerAdapter; make the target pre-exist.\n    result = orchestrator.run("M31-RESTART")\n    project_id, run_id, phase_id = result.durable_project_id, result.durable_run_id, result.durable_phase_id\n    task_id = result.task_records[0].task["task_id"]\n    attempt_id = f"{run_id}:{task_id}:ATTEMPT:1"\n    row = state._connection.execute("SELECT expected_after_identity, workspace_scope_version, workspace_scope_entries, relative_path FROM workspace_evidence WHERE project_id=? AND run_id=? AND phase_id=? AND task_id=? AND attempt_id=? ORDER BY evidence_id DESC LIMIT 1", (project_id, run_id, phase_id, task_id, attempt_id)).fetchone()\n    assert row["relative_path"] == "."\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    scope = tuple(json.loads(row["workspace_scope_entries"]))\n    expected = row["expected_after_identity"]\n    db = state.database_path; state.close()\n    reopened = DurableExecutionState(db)\n    persisted = reopened._connection.execute("SELECT expected_after_identity, workspace_scope_entries FROM workspace_evidence WHERE project_id=? AND run_id=? ORDER BY evidence_id DESC LIMIT 1", (project_id, run_id)).fetchone()\n    reconstructed = workspace_identity_from_scope(tuple(json.loads(persisted["workspace_scope_entries"])), root)\n    assert reconstructed == persisted["expected_after_identity"] == expected\n''', encoding='utf-8')

          # Fix the integration test adapter after writing: build_durable_orchestrator defaults changes=False,
          # therefore the test is a real canonical lifecycle and exercises an empty scope as well as persistence.
          subprocess.run([sys.executable, '-m', 'compileall', '-q', 'durable_execution_state.py', 'durable_execution_evidence.py', 'orchestration.py', 'test_m31_workspace_identity.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'test_m31_workspace_identity.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'test_orchestration_durable.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q'], check=True)
          subprocess.run([sys.executable, 'repository_security_audit.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)

      - name: Commit M3.1 and remove temporary workflows
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durable_execution_state.py durable_execution_evidence.py orchestration.py test_m31_workspace_identity.py .github/workflows/_m31_apply.yml .github/workflows/_m31_apply2.yml .github/workflows/_m31_apply3.yml
          git commit -m "Implement M3.1 workspace identity contract"
          git push origin HEAD:milestone/persistent-project-run-recovery
          git rm .github/workflows/_m31_apply.yml .github/workflows/_m31_apply2.yml .github/workflows/_m31_apply3.yml
          git commit -m "Remove temporary M3.1 apply workflows"
          git push origin HEAD:milestone/persistent-project-run-recovery
