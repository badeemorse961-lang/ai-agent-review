name: M3.1 Finalize
on:
  push:
    branches:
      - milestone/persistent-project-run-recovery
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply M3.1 correction and verify
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess, sys

          root = Path('.')
          state_p = root / 'durable_execution_state.py'
          evidence_p = root / 'durable_execution_evidence.py'
          orch_p = root / 'orchestration.py'

          def replace(path, old, new, count=1):
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), got {actual}: {old[:100]!r}')
              path.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(state_p, 'from pathlib import Path\nfrom typing import Any, Iterable, Mapping, Optional\n', 'from pathlib import Path, PurePosixPath, PureWindowsPath\nfrom typing import Any, Iterable, Mapping, Optional\n')
          replace(state_p, 'SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n', '''SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\nWORKSPACE_SCOPE_VERSION = "workspace-scope-v1"\nWORKSPACE_IDENTITY_ENCODING = "utf-8"\nWORKSPACE_IDENTITY_JSON_SEPARATORS = (",", ":")\n\n\ndef canonical_workspace_scope(targets: Iterable[str], workspace_root: Path) -> tuple[str, ...]:\n    """Canonicalize the exact M3 target set into durable workspace-relative paths."""\n    root = Path(workspace_root).resolve()\n    canonical: set[str] = set()\n    for raw_target in targets:\n        raw = str(raw_target).replace("\\\\", "/")\n        if not raw or raw.startswith("/"):\n            raise ValueError(f"Workspace target must be workspace-relative: {raw_target!r}")\n        windows = PureWindowsPath(raw)\n        if windows.is_absolute() or windows.drive:\n            raise ValueError(f"Workspace target must not be absolute: {raw_target!r}")\n        candidate = (root / Path(*PurePosixPath(raw).parts)).resolve(strict=False)\n        try:\n            relative = candidate.relative_to(root).as_posix()\n        except ValueError as exc:\n            raise ValueError(f"Workspace target escapes workspace root: {raw_target!r}") from exc\n        if relative == ".":\n            raise ValueError("Workspace root is not a valid non-empty scope entry")\n        canonical.add(relative)\n    return tuple(sorted(canonical))\n\n\ndef workspace_path_identity(path: Path) -> str:\n    """Existing M3 path identity semantics: ABSENT, file sha256, or DIRECTORY."""\n    if not path.exists():\n        return "ABSENT"\n    if path.is_file():\n        digest = hashlib.sha256()\n        with path.open("rb") as handle:\n            for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                digest.update(chunk)\n        return "sha256:" + digest.hexdigest()\n    return "DIRECTORY"\n\n\ndef workspace_identity_from_scope(scope: tuple[str, ...], workspace_root: Path) -> str:\n    """Reproduce the M3 identity from a durable canonical scope and current workspace state."""\n    root = Path(workspace_root).resolve()\n    canonical_scope = canonical_workspace_scope(scope, root)\n    entries = []\n    for relative in canonical_scope:\n        candidate = (root / Path(*relative.split("/"))).resolve(strict=False)\n        entries.append((relative, workspace_path_identity(candidate)))\n    material = json.dumps(entries, ensure_ascii=False, sort_keys=True, separators=WORKSPACE_IDENTITY_JSON_SEPARATORS)\n    return hashlib.sha256(material.encode(WORKSPACE_IDENTITY_ENCODING)).hexdigest()\n\n''')
          replace(state_p, '    artifact_id: Optional[str]\n    evidence_created_at: str\n\n    def to_dict', '    artifact_id: Optional[str]\n    evidence_created_at: str\n    workspace_scope_version: Optional[str] = None\n    workspace_scope_entries: Optional[tuple[str, ...]] = None\n\n    def to_dict')
          replace(state_p, '            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n', '            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n            "workspace_scope_version": self.workspace_scope_version,\n            "workspace_scope_entries": list(self.workspace_scope_entries) if self.workspace_scope_entries is not None else None,\n')
          replace(state_p, '            evidence_created_at TEXT NOT NULL,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n            FOREIGN KEY(project_id, run_id, phase_id, task_id, attempt_id)\n', '            evidence_created_at TEXT NOT NULL,\n            workspace_scope_version TEXT,\n            workspace_scope_entries TEXT,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n            FOREIGN KEY(project_id, run_id, phase_id, task_id, attempt_id)\n')
          replace(state_p, '        with self._lock:\n            self._connection.executescript(schema)\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n', '''        with self._lock:\n            self._connection.executescript(schema)\n            columns = {str(item["name"]) for item in self._connection.execute("PRAGMA table_info(workspace_evidence)").fetchall()}\n            if "workspace_scope_version" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_version TEXT")\n            if "workspace_scope_entries" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_entries TEXT")\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n''')
          replace(state_p, 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)')
          replace(state_p, '                    evidence.evidence_created_at,\n                ),', '                    evidence.evidence_created_at,\n                    evidence.workspace_scope_version,\n                    json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None,\n                ),')
          replace(state_p, '    "WorkspaceEvidence",\n    "utc_now",\n', '    "WorkspaceEvidence",\n    "WORKSPACE_SCOPE_VERSION",\n    "canonical_workspace_scope",\n    "workspace_identity_from_scope",\n    "workspace_path_identity",\n    "utc_now",\n')

          replace(evidence_p, '    WorkspaceEvidence,\n    utc_now,\n', '    WorkspaceEvidence,\n    WORKSPACE_SCOPE_VERSION,\n    canonical_workspace_scope,\n    utc_now,\n')
          replace(evidence_p, '        if evidence.observed_state not in {"PRESENT_COMPLETE", "PRESENT_PARTIAL", "ABSENT", "MISMATCH", "AMBIGUOUS"}:\n            raise ValueError("Unsupported workspace observed_state")\n', '''        if evidence.observed_state not in {"PRESENT_COMPLETE", "PRESENT_PARTIAL", "ABSENT", "MISMATCH", "AMBIGUOUS"}:\n            raise ValueError("Unsupported workspace observed_state")\n        if (evidence.workspace_scope_version is None) != (evidence.workspace_scope_entries is None):\n            raise ValueError("Workspace scope metadata must be provided together")\n        if evidence.workspace_scope_version is not None:\n            if evidence.workspace_scope_version != WORKSPACE_SCOPE_VERSION:\n                raise ValueError("Unsupported workspace scope version")\n            project = self.state._require_project(conn, evidence.project_id)\n            canonical = canonical_workspace_scope(evidence.workspace_scope_entries or (), Path(str(project["workspace_root"])))\n            if tuple(evidence.workspace_scope_entries or ()) != canonical:\n                raise ValueError("Workspace scope entries must use canonical M3 representation")\n''')
          replace(evidence_p, '        "evidence_created_at": evidence.evidence_created_at,\n    }\n    return hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n', '        "evidence_created_at": evidence.evidence_created_at,\n    }\n    if evidence.workspace_scope_version is not None or evidence.workspace_scope_entries is not None:\n        payload["workspace_scope_version"] = evidence.workspace_scope_version\n        payload["workspace_scope_entries"] = list(evidence.workspace_scope_entries or ())\n    return hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n')
          replace(evidence_p, 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', 'workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)')
          replace(evidence_p, 'evidence.artifact_id, evidence.evidence_created_at))', 'evidence.artifact_id, evidence.evidence_created_at, evidence.workspace_scope_version, json.dumps(list(evidence.workspace_scope_entries or ()), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None))')
          replace(evidence_p, '        payload = {"project_id": row["project_id"], "run_id": row["run_id"], "phase_id": row["phase_id"], "task_id": row["task_id"], "attempt_id": row["attempt_id"], "relative_path": row["relative_path"], "change_kind": row["change_kind"], "expected_before_identity": row["expected_before_identity"], "observed_before_identity": row["observed_before_identity"], "expected_after_identity": row["expected_after_identity"], "observed_after_identity": row["observed_after_identity"], "observed_state": row["observed_state"], "checkpoint_id": row["checkpoint_id"], "artifact_id": row["artifact_id"], "evidence_created_at": row["evidence_created_at"]}\n        return hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n', '''        payload = {"project_id": row["project_id"], "run_id": row["run_id"], "phase_id": row["phase_id"], "task_id": row["task_id"], "attempt_id": row["attempt_id"], "relative_path": row["relative_path"], "change_kind": row["change_kind"], "expected_before_identity": row["expected_before_identity"], "observed_before_identity": row["observed_before_identity"], "expected_after_identity": row["expected_after_identity"], "observed_after_identity": row["observed_after_identity"], "observed_state": row["observed_state"], "checkpoint_id": row["checkpoint_id"], "artifact_id": row["artifact_id"], "evidence_created_at": row["evidence_created_at"]}\n        if row["workspace_scope_version"] is not None or row["workspace_scope_entries"] is not None:\n            payload["workspace_scope_version"] = row["workspace_scope_version"]\n            payload["workspace_scope_entries"] = list(json.loads(row["workspace_scope_entries"] or "[]"))\n        return hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n''')

          replace(orch_p, 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, utc_now\n', 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION, canonical_workspace_scope, utc_now, workspace_identity_from_scope, workspace_path_identity\n')
          replace(orch_p, 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str) -> tuple[str, str, str, int]:', 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str, workspace_scope: tuple[str, ...]) -> tuple[str, str, str, int]:')
          replace(orch_p, 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now())', 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now(), workspace_scope_version=WORKSPACE_SCOPE_VERSION, workspace_scope_entries=workspace_scope)')
          replace(orch_p, '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        entries: list[tuple[str, str]] = []\n        for target in sorted(set(targets)):\n            candidate = (self.workspace_root / target).resolve(strict=False)\n            try:\n                candidate.relative_to(self.workspace_root)\n            except ValueError as exc:\n                raise OrchestrationSafetyStop(f"Workspace target escapes durable workspace: {target!r}") from exc\n            entries.append((target, self._path_identity(candidate)))\n        return hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()\n''', '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        try:\n            scope = canonical_workspace_scope(targets, self.workspace_root)\n        except ValueError as exc:\n            raise OrchestrationSafetyStop(str(exc)) from exc\n        return workspace_identity_from_scope(scope, self.workspace_root)\n''')
          replace(orch_p, '''    @staticmethod\n    def _path_identity(path: Path) -> str:\n        if not path.exists():\n            return "ABSENT"\n        if path.is_file():\n            digest = hashlib.sha256()\n            with path.open("rb") as handle:\n                for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                    digest.update(chunk)\n            return "sha256:" + digest.hexdigest()\n        return "DIRECTORY"\n''', '''    @staticmethod\n    def _path_identity(path: Path) -> str:\n        return workspace_path_identity(path)\n''')
          replace(orch_p, '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        if not targets:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in targets]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n''', '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        canonical = canonical_workspace_scope(targets, root)\n        if not canonical:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in canonical]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n''')
          replace(orch_p, 'return WorkspaceEvidence(project_id=str(row["project_id"]), run_id=str(row["run_id"]), phase_id=str(row["phase_id"]), task_id=str(row["task_id"]), attempt_id=str(row["attempt_id"]), relative_path=str(row["relative_path"]), change_kind=str(row["change_kind"]), expected_before_identity=row["expected_before_identity"], observed_before_identity=row["observed_before_identity"], expected_after_identity=row["expected_after_identity"], observed_after_identity=row["observed_after_identity"], observed_state=str(row["observed_state"]), checkpoint_id=row["checkpoint_id"], artifact_id=row["artifact_id"], evidence_created_at=str(row["evidence_created_at"]))', 'return WorkspaceEvidence(project_id=str(row["project_id"]), run_id=str(row["run_id"]), phase_id=str(row["phase_id"]), task_id=str(row["task_id"]), attempt_id=str(row["attempt_id"]), relative_path=str(row["relative_path"]), change_kind=str(row["change_kind"]), expected_before_identity=row["expected_before_identity"], observed_before_identity=row["observed_before_identity"], expected_after_identity=row["expected_after_identity"], observed_after_identity=row["observed_after_identity"], observed_state=str(row["observed_state"]), checkpoint_id=row["checkpoint_id"], artifact_id=row["artifact_id"], evidence_created_at=str(row["evidence_created_at"]), workspace_scope_version=row["workspace_scope_version"], workspace_scope_entries=tuple(json.loads(row["workspace_scope_entries"])) if row["workspace_scope_entries"] is not None else None)')
          replace(orch_p, '                before_identity = self._durable._workspace_identity(spec.changed_targets) if self._durable is not None else ""\n', '                workspace_scope = canonical_workspace_scope(spec.changed_targets, self.workspace_root) if self._durable is not None else ()\n                before_identity = self._durable._workspace_identity(workspace_scope) if self._durable is not None else ""\n')
          replace(orch_p, '                    _, durable_evidence_hash, durable_artifact_id, durable_checkpoint_sequence = self._durable.persist_post_execution(durable_run_id, durable_phase_id, current_task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, self._durable._observed_state(spec.changed_targets, self.workspace_root))\n', '                    _, durable_evidence_hash, durable_artifact_id, durable_checkpoint_sequence = self._durable.persist_post_execution(durable_run_id, durable_phase_id, current_task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, self._durable._observed_state(workspace_scope, self.workspace_root), workspace_scope)\n')

          tests = Path('test_m31_workspace_identity.py')
          tests.write_text('''from pathlib import Path\nimport json\nimport pytest\n\nfrom durable_execution_evidence import EvidenceLayer\nfrom durable_execution_state import DurableExecutionState, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION, canonical_workspace_scope, workspace_identity_from_scope\nfrom test_orchestration_durable import build_durable_orchestrator\n\ndef new_state(tmp_path):\n    root = tmp_path / "project"; root.mkdir()\n    db = tmp_path / "execution.sqlite3"\n    state = DurableExecutionState(db)\n    project_id = state.create_project(workspace_root=root)\n    run = state.create_run(project_id)\n    state.create_phase(project_id=project_id, run_id=run.run_id, phase_id="phase-1", ordinal=1, name="M3.1")\n    state.create_task(project_id=project_id, run_id=run.run_id, phase_id="phase-1", task_id="task-1")\n    state.create_attempt(project_id=project_id, run_id=run.run_id, phase_id="phase-1", task_id="task-1", attempt_id="attempt-1")\n    return root, db, state, project_id, run.run_id\n\ndef test_scope_contract(tmp_path):\n    root = tmp_path / "p"; root.mkdir()\n    assert canonical_workspace_scope(("b\\\\x.txt", "a.txt", "b/x.txt", "./a.txt"), root) == ("a.txt", "b/x.txt")\n    with pytest.raises(ValueError): canonical_workspace_scope((str((root / "absolute.txt").resolve()),), root)\n    with pytest.raises(ValueError): canonical_workspace_scope(("../outside.txt",), root)\n    with pytest.raises(ValueError): canonical_workspace_scope(("C:/outside.txt",), root)\n\ndef test_empty_scope(tmp_path):\n    root = tmp_path / "p"; root.mkdir()\n    assert canonical_workspace_scope((), root) == ()\n    assert workspace_identity_from_scope((), root) == workspace_identity_from_scope((), root)\n\ndef test_in_scope_changes_and_outside_scope_stability(tmp_path):\n    root = tmp_path / "p"; root.mkdir(); (root / "target.txt").write_text("one", encoding="utf-8")\n    scope = canonical_workspace_scope(("target.txt",), root)\n    first = workspace_identity_from_scope(scope, root)\n    (root / "outside.txt").write_text("outside", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) == first\n    (root / "target.txt").write_text("two", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) != first\n\ndef test_directory_and_absent_semantics(tmp_path):\n    root = tmp_path / "p"; root.mkdir(); (root / "directory").mkdir()\n    scope = canonical_workspace_scope(("directory", "missing.txt"), root)\n    before = workspace_identity_from_scope(scope, root)\n    (root / "missing.txt").write_text("now", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) != before\n\ndef test_new_evidence_persists_scope(tmp_path):\n    root, _, state, project_id, run_id = new_state(tmp_path)\n    scope = canonical_workspace_scope(("b.txt", "a.txt", "a.txt"), root)\n    identity = workspace_identity_from_scope(scope, root)\n    evidence = WorkspaceEvidence(project_id, run_id, "phase-1", "task-1", "attempt-1", ".", "MODIFIED", identity, identity, identity, identity, "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", WORKSPACE_SCOPE_VERSION, scope)\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(evidence)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert json.loads(row["workspace_scope_entries"]) == ["a.txt", "b.txt"]\n\ndef test_restart_reconstructs_exact_identity(tmp_path):\n    root, db, state, project_id, run_id = new_state(tmp_path)\n    (root / "target.txt").write_text("stable", encoding="utf-8")\n    scope = canonical_workspace_scope(("target.txt",), root)\n    expected = workspace_identity_from_scope(scope, root)\n    evidence = WorkspaceEvidence(project_id, run_id, "phase-1", "task-1", "attempt-1", ".", "MODIFIED", expected, expected, expected, expected, "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", WORKSPACE_SCOPE_VERSION, scope)\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(evidence)\n    state.close()\n    reopened = DurableExecutionState(db)\n    row = reopened._connection.execute("SELECT relative_path, expected_after_identity, workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    reconstructed = workspace_identity_from_scope(tuple(json.loads(row["workspace_scope_entries"])), root)\n    assert row["relative_path"] == "."\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert reconstructed == row["expected_after_identity"] == expected\n\ndef test_real_m3_lifecycle_persists_scope_and_restarts(tmp_path):\n    root = tmp_path / "real"; root.mkdir(); db = tmp_path / "real.sqlite3"\n    orchestrator, state, _, _ = build_durable_orchestrator(root, db)\n    result = orchestrator.run("M31-REAL")\n    row = state._connection.execute("SELECT relative_path, expected_after_identity, workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE project_id=? AND run_id=? ORDER BY evidence_id DESC LIMIT 1", (result.durable_project_id, result.durable_run_id)).fetchone()\n    assert row["relative_path"] == "." and row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert json.loads(row["workspace_scope_entries"]) == []\n    expected = row["expected_after_identity"]\n    state.close()\n    reopened = DurableExecutionState(db)\n    persisted = reopened._connection.execute("SELECT expected_after_identity, workspace_scope_entries FROM workspace_evidence WHERE project_id=? AND run_id=? ORDER BY evidence_id DESC LIMIT 1", (result.durable_project_id, result.durable_run_id)).fetchone()\n    assert workspace_identity_from_scope(tuple(json.loads(persisted["workspace_scope_entries"])), root) == expected\n\ndef test_legacy_evidence_is_insufficient(tmp_path):\n    root, _, state, project_id, run_id = new_state(tmp_path)\n    legacy = WorkspaceEvidence(project_id, run_id, "phase-1", "task-1", "attempt-1", ".", "MODIFIED", "x", "x", "x", "x", "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00")\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(legacy)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] is None and row["workspace_scope_entries"] is None\n\ndef test_unsupported_scope_version_rejected(tmp_path):\n    root, _, state, project_id, run_id = new_state(tmp_path)\n    bad = WorkspaceEvidence(project_id, run_id, "phase-1", "task-1", "attempt-1", ".", "MODIFIED", "x", "x", "x", "x", "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", "workspace-scope-v999", ("a.txt",))\n    with pytest.raises(ValueError, match="Unsupported workspace scope version"):\n        EvidenceLayer(state).record_workspace_evidence(bad)\n''', encoding='utf-8')

