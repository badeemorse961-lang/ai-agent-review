name: Repository Security Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security invariant audit
        run: python repository_security_audit.py
      - name: Verify cross-process workspace mutation lock
        run: pytest -q test_workspace_mutation_lock.py test_workspace_mutation_lock_multiprocess.py
