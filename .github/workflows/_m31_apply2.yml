name: M3.1 Contract Correction Retry

on:
  push:
    branches:
      - milestone/persistent-project-run-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'badeemorse961-lang'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify M3.1
        shell: python
        run: |
          from pathlib import Path
          import json, re, subprocess, sys

          root = Path('.')
          state = root / 'durable_execution_state.py'
          evidence = root / 'durable_execution_evidence.py'
          orchestration = root / 'orchestration.py'

          text = state.read_text(encoding='utf-8')
          marker = 'SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n'
          replacement = '''SCHEMA_VERSION = 1\nGENESIS_HASH = "GENESIS"\n\nWORKSPACE_SCOPE_VERSION = "workspace-scope-v1"\nWORKSPACE_IDENTITY_ENCODING = "utf-8"\nWORKSPACE_IDENTITY_JSON_SEPARATORS = (",", ":")\n\n\ndef _workspace_identity_path(root: Path, relative_path: str) -> Path:\n    return (root / Path(*relative_path.split("/"))).resolve(strict=False)\n\n\ndef canonical_workspace_scope(targets: Iterable[str], workspace_root: Path) -> tuple[str, ...]:\n    root = Path(workspace_root).resolve()\n    canonical: set[str] = set()\n    for raw_target in targets:\n        raw = str(raw_target).replace("\\\\", "/")\n        if not raw or raw.startswith("/"):\n            raise ValueError(f"Workspace target must be workspace-relative: {raw_target!r}")\n        windows = PureWindowsPath(raw)\n        if windows.is_absolute() or windows.drive:\n            raise ValueError(f"Workspace target must not be absolute: {raw_target!r}")\n        candidate = (root / Path(*PurePosixPath(raw).parts)).resolve(strict=False)\n        try:\n            relative = candidate.relative_to(root).as_posix()\n        except ValueError as exc:\n            raise ValueError(f"Workspace target escapes workspace root: {raw_target!r}") from exc\n        canonical.add(relative)\n    return tuple(sorted(canonical))\n\n\ndef _canonical_workspace_identity_json(entries: list[tuple[str, str]]) -> str:\n    return json.dumps(entries, ensure_ascii=False, separators=WORKSPACE_IDENTITY_JSON_SEPARATORS)\n\n\ndef workspace_path_identity(path: Path) -> str:\n    if not path.exists():\n        return "ABSENT"\n    if path.is_file():\n        digest = hashlib.sha256()\n        with path.open("rb") as handle:\n            for chunk in iter(lambda: handle.read(1024 * 1024), b""):\n                digest.update(chunk)\n        return "sha256:" + digest.hexdigest()\n    return "DIRECTORY"\n\n\ndef workspace_identity_from_scope(scope: tuple[str, ...], workspace_root: Path) -> str:\n    root = Path(workspace_root).resolve()\n    canonical_scope = canonical_workspace_scope(scope, root)\n    entries = [(relative, workspace_path_identity(_workspace_identity_path(root, relative))) for relative in canonical_scope]\n    return hashlib.sha256(_canonical_workspace_identity_json(entries).encode(WORKSPACE_IDENTITY_ENCODING)).hexdigest()\n\n'''
          if marker not in text: raise SystemExit('state marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom pathlib import PurePosixPath, PureWindowsPath\n', 1)
          fields = '    checkpoint_id: Optional[str]\n    artifact_id: Optional[str]\n    evidence_created_at: str\n'
          if fields not in text: raise SystemExit('WorkspaceEvidence fields marker not found')
          text = text.replace(fields, fields + '    workspace_scope_version: Optional[str] = None\n    workspace_scope_entries: Optional[tuple[str, ...]] = None\n', 1)
          dmarker = '            "artifact_id": self.artifact_id,\n            "evidence_created_at": self.evidence_created_at,\n'
          if dmarker not in text: raise SystemExit('WorkspaceEvidence dict marker not found')
          text = text.replace(dmarker, dmarker + '            "workspace_scope_version": self.workspace_scope_version,\n            "workspace_scope_entries": list(self.workspace_scope_entries) if self.workspace_scope_entries is not None else None,\n', 1)
          table_marker = '            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n'
          table_repl = '            artifact_id TEXT,\n            evidence_created_at TEXT NOT NULL,\n            workspace_scope_version TEXT,\n            workspace_scope_entries TEXT,\n            FOREIGN KEY(project_id) REFERENCES projects(project_id),\n'
          if table_marker not in text: raise SystemExit('schema marker not found')
          text = text.replace(table_marker, table_repl, 1)
          init_marker = '        with self._lock:\n            self._connection.executescript(schema)\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'
          init_repl = '        with self._lock:\n            self._connection.executescript(schema)\n            columns = {str(item["name"]) for item in self._connection.execute("PRAGMA table_info(workspace_evidence)").fetchall()}\n            if "workspace_scope_version" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_version TEXT")\n            if "workspace_scope_entries" not in columns:\n                self._connection.execute("ALTER TABLE workspace_evidence ADD COLUMN workspace_scope_entries TEXT")\n            row = self._connection.execute("SELECT schema_version FROM schema_meta LIMIT 1").fetchone()\n'
          if init_marker not in text: raise SystemExit('schema init marker not found')
          text = text.replace(init_marker, init_repl, 1)
          insert_marker = '                "INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",\n'
          if insert_marker not in text: raise SystemExit('state evidence INSERT marker not found')
          text = text.replace(insert_marker, '                "INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",\n', 1)
          value_marker = '                    evidence.evidence_created_at,\n                ),\n'
          if value_marker not in text: raise SystemExit('state evidence values marker not found')
          text = text.replace(value_marker, '                    evidence.evidence_created_at,\n                    evidence.workspace_scope_version,\n                    json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None,\n                ),\n', 1)
          text = text.replace('    "WorkspaceEvidence",\n', '    "WorkspaceEvidence",\n    "WORKSPACE_SCOPE_VERSION",\n    "canonical_workspace_scope",\n    "workspace_identity_from_scope",\n    "workspace_path_identity",\n', 1)
          state.write_text(text, encoding='utf-8')

          text = evidence.read_text(encoding='utf-8')
          text = text.replace('from durable_execution_state import (\n', 'from durable_execution_state import (\n    WORKSPACE_SCOPE_VERSION,\n', 1)
          digest_marker = '        "artifact_id": evidence.artifact_id,\n        "evidence_created_at": evidence.evidence_created_at,\n'
          if digest_marker not in text: raise SystemExit('digest marker not found')
          text = text.replace(digest_marker, digest_marker + '        "workspace_scope_version": evidence.workspace_scope_version,\n        "workspace_scope_entries": list(evidence.workspace_scope_entries) if evidence.workspace_scope_entries is not None else None,\n', 1)
          layer_insert = '            cursor = conn.execute("INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",'
          if layer_insert not in text: raise SystemExit('EvidenceLayer INSERT marker not found')
          text = text.replace(layer_insert, '            cursor = conn.execute("INSERT INTO workspace_evidence(project_id, run_id, phase_id, task_id, attempt_id, relative_path, change_kind, expected_before_identity, observed_before_identity, expected_after_identity, observed_after_identity, observed_state, checkpoint_id, artifact_id, evidence_created_at, workspace_scope_version, workspace_scope_entries) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",', 1)
          text = text.replace('evidence.artifact_id, evidence.evidence_created_at))', 'evidence.artifact_id, evidence.evidence_created_at, evidence.workspace_scope_version, json.dumps(list(evidence.workspace_scope_entries), ensure_ascii=False, separators=(",", ":")) if evidence.workspace_scope_entries is not None else None))', 1)
          validate_marker = '        if evidence.observed_state not in {"PRESENT_COMPLETE", "PRESENT_PARTIAL", "ABSENT", "MISMATCH", "AMBIGUOUS"}:\n            raise ValueError("Unsupported workspace observed_state")\n'
          if validate_marker not in text: raise SystemExit('EvidenceLayer validation marker not found')
          text = text.replace(validate_marker, validate_marker + '        if (evidence.workspace_scope_version is None) != (evidence.workspace_scope_entries is None):\n            raise ValueError("Workspace scope metadata must be provided together")\n        if evidence.workspace_scope_version is not None and evidence.workspace_scope_version != WORKSPACE_SCOPE_VERSION:\n            raise ValueError("Unsupported workspace scope version")\n', 1)
          evidence.write_text(text, encoding='utf-8')

          text = orchestration.read_text(encoding='utf-8')
          old_import = 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, utc_now\n'
          new_import = 'from durable_execution_state import DurableExecutionState, LineageError, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION, canonical_workspace_scope, utc_now, workspace_identity_from_scope, workspace_path_identity\n'
          if old_import not in text: raise SystemExit('orchestration import marker not found')
          text = text.replace(old_import, new_import, 1)
          sig = 'def persist_post_execution(self, run_id: str, phase_id: str, task_id: str, attempt_id: str, raw_checkpoint_id: str, before_identity: str, after_identity: str, observed_state: str) -> tuple[str, str, str, int]:'
          if sig not in text: raise SystemExit('persist signature marker not found')
          text = text.replace(sig, sig[:-1] + ', workspace_scope: tuple[str, ...]) -> tuple[str, str, str, int]:', 1)
          ev = 'evidence = WorkspaceEvidence(project_id=self.project_id, run_id=run_id, phase_id=phase_id, task_id=task_id, attempt_id=attempt_id, relative_path=".", change_kind="MODIFIED", expected_before_identity=before_identity, observed_before_identity=before_identity, expected_after_identity=after_identity, observed_after_identity=after_identity, observed_state=observed_state, checkpoint_id=None, artifact_id=artifact_id, evidence_created_at=utc_now())'
          if ev not in text: raise SystemExit('M3 evidence construction marker not found')
          text = text.replace(ev, ev[:-1] + ', workspace_scope_version=WORKSPACE_SCOPE_VERSION, workspace_scope_entries=workspace_scope)', 1)
          ident_pattern = r'    def _workspace_identity\(self, targets: tuple\[str, \.\.\.\]\) -> str:\n(?:        .*\n)+?    @staticmethod\n    def _path_identity'
          ident_repl = '''    def _workspace_identity(self, targets: tuple[str, ...]) -> str:\n        try:\n            scope = canonical_workspace_scope(targets, self.workspace_root)\n        except ValueError as exc:\n            raise OrchestrationSafetyStop(str(exc)) from exc\n        return workspace_identity_from_scope(scope, self.workspace_root)\n\n    @staticmethod\n    def _path_identity'''
          text, count = re.subn(ident_pattern, ident_repl, text, count=1)
          if count != 1: raise SystemExit('workspace identity method marker not found')
          path_pattern = r'    @staticmethod\n    def _path_identity\(path: Path\) -> str:\n(?:        .*\n)+?    @staticmethod\n    def _observed_state'
          path_repl = '''    @staticmethod\n    def _path_identity(path: Path) -> str:\n        return workspace_path_identity(path)\n\n    @staticmethod\n    def _observed_state'''
          text, count = re.subn(path_pattern, path_repl, text, count=1)
          if count != 1: raise SystemExit('path identity method marker not found')
          observed_pattern = r'    @staticmethod\n    def _observed_state\(targets: tuple\[str, \.\.\.\], root: Path\) -> str:\n(?:        .*\n)+?    @staticmethod\n    def _evidence_from_row'
          observed_repl = '''    @staticmethod\n    def _observed_state(targets: tuple[str, ...], root: Path) -> str:\n        canonical = canonical_workspace_scope(targets, root)\n        if not canonical:\n            return "PRESENT_COMPLETE"\n        states = [_DurableLifecycleBridge._path_identity((root / target).resolve(strict=False)) for target in canonical]\n        if all(value == "ABSENT" for value in states):\n            return "ABSENT"\n        if any(value == "ABSENT" for value in states):\n            return "PRESENT_PARTIAL"\n        return "PRESENT_COMPLETE"\n\n    @staticmethod\n    def _evidence_from_row'''
          text, count = re.subn(observed_pattern, observed_repl, text, count=1)
          if count != 1: raise SystemExit('observed state marker not found')
          row_pattern = r'return WorkspaceEvidence\(project_id=str\(row\["project_id"\]\),.*?evidence_created_at=str\(row\["evidence_created_at"\]\)\)'
          row_repl = 'return WorkspaceEvidence(project_id=str(row["project_id"]), run_id=str(row["run_id"]), phase_id=str(row["phase_id"]), task_id=str(row["task_id"]), attempt_id=str(row["attempt_id"]), relative_path=str(row["relative_path"]), change_kind=str(row["change_kind"]), expected_before_identity=row["expected_before_identity"], observed_before_identity=row["observed_before_identity"], expected_after_identity=row["expected_after_identity"], observed_after_identity=row["observed_after_identity"], observed_state=str(row["observed_state"]), checkpoint_id=row["checkpoint_id"], artifact_id=row["artifact_id"], evidence_created_at=str(row["evidence_created_at"]), workspace_scope_version=row["workspace_scope_version"], workspace_scope_entries=tuple(json.loads(row["workspace_scope_entries"])) if row["workspace_scope_entries"] is not None else None)'
          text, count = re.subn(row_pattern, row_repl, text, count=1, flags=re.S)
          if count != 1: raise SystemExit('evidence row reconstruction marker not found')
          call_old = 'self._durable.persist_post_execution(durable_run_id, durable_phase_id, current_task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, self._durable._observed_state(spec.changed_targets, self.workspace_root))'
          call_new = 'self._durable.persist_post_execution(durable_run_id, durable_phase_id, current_task_id, attempt_id, raw_checkpoint_id, before_identity, after_identity, self._durable._observed_state(spec.changed_targets, self.workspace_root), canonical_workspace_scope(spec.changed_targets, self.workspace_root))'
          if call_old not in text: raise SystemExit('persist call marker not found')
          text = text.replace(call_old, call_new, 1)
          orchestration.write_text(text, encoding='utf-8')

          tests = root / 'test_m31_workspace_identity.py'
          tests.write_text('''from pathlib import Path\nimport json\nimport pytest\nfrom durable_execution_evidence import EvidenceLayer\nfrom durable_execution_state import (\n    DurableExecutionState, WorkspaceEvidence, WORKSPACE_SCOPE_VERSION,\n    canonical_workspace_scope, workspace_identity_from_scope,\n)\nfrom orchestration import _DurableLifecycleBridge\n\n\ndef _lineage(state, bridge, run_id):\n    phase, task, attempt = "phase-1", "task-1", "attempt-1"\n    bridge.start_phase(run_id, phase)\n    bridge.start_task(run_id, phase, {"task_id": task, "objective": "test"})\n    bridge.start_attempt(run_id, phase, task, attempt, "worker-1")\n    return phase, task, attempt\n\n\ndef _new_state(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    db = tmp_path / "state.db"\n    state = DurableExecutionState(db)\n    bridge = _DurableLifecycleBridge(state, root)\n    run_id = bridge.create_run()\n    return root, db, state, bridge, run_id\n\n\ndef test_new_evidence_persists_canonical_scope(tmp_path):\n    root, _, state, bridge, run_id = _new_state(tmp_path)\n    (root / "b.txt").write_text("b", encoding="utf-8")\n    (root / "a.txt").write_text("a", encoding="utf-8")\n    scope = canonical_workspace_scope(("b.txt", "a.txt", "a.txt"), root)\n    phase, task, attempt = _lineage(state, bridge, run_id)\n    identity = workspace_identity_from_scope(scope, root)\n    evidence = WorkspaceEvidence(bridge.project_id, run_id, phase, task, attempt, ".", "MODIFIED", identity, identity, identity, identity, "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", WORKSPACE_SCOPE_VERSION, scope)\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(evidence)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert row["workspace_scope_entries"] == '["a.txt","b.txt"]'\n\n\ndef test_scope_is_deterministic_and_rejects_unsafe_paths(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    assert canonical_workspace_scope(("b\\\\x.txt", "a.txt", "b/x.txt", "./a.txt"), root) == ("a.txt", "b/x.txt")\n    with pytest.raises(ValueError): canonical_workspace_scope((str(root / "absolute.txt"),), root)\n    with pytest.raises(ValueError): canonical_workspace_scope(("../outside.txt",), root)\n\n\ndef test_empty_scope_is_empty_and_deterministic(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    assert canonical_workspace_scope((), root) == ()\n    assert workspace_identity_from_scope((), root) == workspace_identity_from_scope((), root)\n\n\ndef test_file_directory_absent_and_outside_scope_semantics(tmp_path):\n    root = tmp_path / "workspace"; root.mkdir()\n    (root / "file.txt").write_text("v1", encoding="utf-8")\n    (root / "dir").mkdir()\n    scope = canonical_workspace_scope(("file.txt", "dir", "missing.txt"), root)\n    first = workspace_identity_from_scope(scope, root)\n    (root / "file.txt").write_text("v2", encoding="utf-8")\n    second = workspace_identity_from_scope(scope, root)\n    assert first != second\n    (root / "outside.txt").write_text("outside", encoding="utf-8")\n    assert workspace_identity_from_scope(scope, root) == second\n\n\ndef test_restart_reconstructs_exact_persisted_m3_identity(tmp_path):\n    root, db, state, bridge, run_id = _new_state(tmp_path)\n    (root / "changed.txt").write_text("v1", encoding="utf-8")\n    scope = canonical_workspace_scope(("changed.txt",), root)\n    phase, task, attempt = _lineage(state, bridge, run_id)\n    expected = workspace_identity_from_scope(scope, root)\n    evidence = WorkspaceEvidence(bridge.project_id, run_id, phase, task, attempt, ".", "MODIFIED", expected, expected, expected, expected, "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", WORKSPACE_SCOPE_VERSION, scope)\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(evidence)\n    state.close()\n    reopened = DurableExecutionState(db)\n    row = reopened._connection.execute("SELECT * FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    persisted_scope = tuple(json.loads(row["workspace_scope_entries"]))\n    reconstructed = workspace_identity_from_scope(persisted_scope, root)\n    assert row["relative_path"] == "."\n    assert row["workspace_scope_version"] == WORKSPACE_SCOPE_VERSION\n    assert reconstructed == row["expected_after_identity"]\n\n\ndef test_legacy_scope_metadata_is_absent_not_guessed(tmp_path):\n    root, _, state, bridge, run_id = _new_state(tmp_path)\n    phase, task, attempt = _lineage(state, bridge, run_id)\n    legacy = WorkspaceEvidence(bridge.project_id, run_id, phase, task, attempt, ".", "MODIFIED", "x", "x", "x", "x", "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00")\n    evidence_id = EvidenceLayer(state).record_workspace_evidence(legacy)\n    row = state._connection.execute("SELECT workspace_scope_version, workspace_scope_entries FROM workspace_evidence WHERE evidence_id=?", (evidence_id,)).fetchone()\n    assert row["workspace_scope_version"] is None and row["workspace_scope_entries"] is None\n\n\ndef test_unsupported_scope_version_is_rejected(tmp_path):\n    root, _, state, bridge, run_id = _new_state(tmp_path)\n    phase, task, attempt = _lineage(state, bridge, run_id)\n    bad = WorkspaceEvidence(bridge.project_id, run_id, phase, task, attempt, ".", "MODIFIED", "x", "x", "x", "x", "PRESENT_COMPLETE", None, None, "2026-01-01T00:00:00+00:00", "workspace-scope-v999", ("a.txt",))\n    with pytest.raises(ValueError, match="Unsupported workspace scope version"):\n        EvidenceLayer(state).record_workspace_evidence(bad)\n''', encoding='utf-8')

          subprocess.run([sys.executable, '-m', 'compileall', '-q', 'durable_execution_state.py', 'durable_execution_evidence.py', 'orchestration.py', 'test_m31_workspace_identity.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'test_m31_workspace_identity.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'test_orchestration.py', 'test_production_runtime.py', 'test_provider_transport.py'], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', '-q'], check=True)
          subprocess.run([sys.executable, 'repository_security_audit.py'], check=True)

      - name: Commit M3.1 files and remove helper workflows
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durable_execution_state.py durable_execution_evidence.py orchestration.py test_m31_workspace_identity.py .github/workflows/_m31_apply.yml .github/workflows/_m31_apply2.yml
          git commit -m "Correct M3 workspace identity contract"
          git push origin HEAD:milestone/persistent-project-run-recovery
          git rm .github/workflows/_m31_apply.yml .github/workflows/_m31_apply2.yml
          git commit -m "Remove temporary M3.1 apply workflows"
          git push origin HEAD:milestone/persistent-project-run-recovery
